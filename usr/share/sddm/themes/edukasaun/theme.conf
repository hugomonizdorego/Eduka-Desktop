[General]
# Edukasaun login screen. Eduka-Settings → Login Screen writes its
# choices to theme.conf.user, which overrides this file.
# style: pastel, light, dark or glass. accent: color of the login button.
style=pastel
accent=#ef8063
showClock=true
# Replace this file to change the login background (any size; it is cropped
# to fill the screen). Without it a soft Edukasaun gradient is shown.
background=/usr/share/Edukasaun/SDDM/Default.png
logo=/usr/share/Edukasaun/Logo/Edukasaun Logo.png
title=Edukasaun
defaultUser=edukasaun
