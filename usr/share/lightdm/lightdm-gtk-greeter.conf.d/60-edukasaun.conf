# Edukasaun login screen for lightdm-gtk-greeter: the same look as the SDDM
# login screen (pastel style). Eduka-Settings → Login & Fingerprint → LightDM
# writes the chosen look to /etc/xdg/lightdm/lightdm-gtk-greeter.conf.d.
[greeter]
background=/usr/share/edukasaun-desktop/login/pastel.png
user-background=false
theme-name=Edukasaun-Login
icon-theme-name=Papirus-Light
font-name=Sans 11
xft-antialias=true
xft-hintstyle=hintslight
default-user-image=/usr/share/sddm/themes/edukasaun/logo.png
round-user-image=true
highlight-logged-user=true
position=50%,center 50%,center
panel-position=top
clock-format=%H:%M · %a %d %b
indicators=~host;~spacer;~clock;~spacer;~a11y;~power
