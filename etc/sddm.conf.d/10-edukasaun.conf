# Edukasaun OS login screen (SDDM).
[General]
# On-screen keyboard of the login screen (needs qml-module-qtquick-virtualkeyboard).
InputMethod=qtvirtualkeyboard
# The login screen reads and writes the language picked there in
# /var/lib/edukasaun-desktop/login/language (see eduka-desktop-session).
GreeterEnvironment=QML_XHR_ALLOW_FILE_READ=1,QML_XHR_ALLOW_FILE_WRITE=1

[Theme]
Current=edukasaun

[Users]
RememberLastUser=true
RememberLastSession=true
